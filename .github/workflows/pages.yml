name: Test and publish Ravelfront
on:
  push:
    branches: [main]
    paths-ignore: [public/room-test.html, public/room-test.js, public/server-check.html, public/server-check.js, .github/workflows/publish-room-test.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ravelfront-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      atv_only: ${{ steps.scope.outputs.atv_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - id: scope
        name: Select checks from the actual changed files
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          files=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          allowed={'src/atv-model.js','src/vehicle-view.js','scripts/atv-browser-check.mjs','tests/atv-presentation.test.js','package.json','package-lock.json','src/releases.js','docs/UPDATE_152.md','.github/workflows/pages.yml'}
          visual={'src/atv-model.js','src/vehicle-view.js'}
          previous=set(subprocess.check_output(['git','diff','--name-only','HEAD^^','HEAD^'],text=True).splitlines())
          workflow_fix='.github/workflows/pages.yml' in files and files<={'.github/workflows/pages.yml','docs/UPDATE_152.md'} and previous<=allowed and bool(previous&visual)
          scoped=files<=allowed and (bool(files&visual) or workflow_fix)
          for path in ['package.json','package-lock.json']:
            if path not in files: continue
            old=json.loads(subprocess.check_output(['git','show','HEAD^:'+path],text=True));new=json.loads(Path(path).read_text())
            for value in [old,new]:
              value.pop('version',None)
              if path=='package-lock.json': value.get('packages',{}).get('',{}).pop('version',None)
            scoped=scoped and old==new
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('atv_only='+str(scoped).lower()+'\n')
          print('ATV visual-only release:',scoped)
          PY
  build:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ATV geometry, animation, driving, seats and recovery
        if: needs.scope.outputs.atv_only == 'true'
        run: node --test tests/atv-presentation.test.js tests/frontier-145.test.js
      - name: All unit and real socket regression tests
        if: needs.scope.outputs.atv_only != 'true'
        run: node --test --test-concurrency=2 tests/*.test.js
      - name: Public host election, reconnection, migration, scoring and inventory
        if: needs.scope.outputs.atv_only != 'true'
        run: node scripts/public-host-network-check.mjs
      - name: Map publishing and pinned multiplayer layouts
        if: needs.scope.outputs.atv_only != 'true'
        run: node scripts/map-editor-network-check.mjs
      - name: Frontline captures, rewards and interrupted recovery across real sockets
        if: needs.scope.outputs.atv_only != 'true'
        run: node scripts/frontline-network-check.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ravelfront-build
          path: dist
          retention-days: 7
  browser:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Actual ATV appearance, desktop and mobile, driving and two riders
        if: needs.scope.outputs.atv_only == 'true'
        run: node scripts/atv-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.atv_only == 'true'
        with:
          name: atv-browser-evidence
          path: test-results/expansion/atv
          retention-days: 14
      - name: Sentinels, capture HUD, live roster, presence, reconnection and inbox
        if: needs.scope.outputs.atv_only != 'true'
        run: node scripts/field-stability-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.atv_only != 'true'
        with:
          name: field-stability-browser-evidence
          path: test-results/expansion/stability
          retention-days: 14
      - name: Shop collections, boss models, styles, bundles, purchases and update art
        if: needs.scope.outputs.atv_only != 'true'
        run: node scripts/shop-overhaul-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.atv_only != 'true'
        with:
          name: shop-browser-evidence
          path: test-results/expansion/shop
          retention-days: 14
      - name: Desktop/mobile controls, inventory, combat HUD and camera
        if: needs.scope.outputs.atv_only != 'true'
        run: node scripts/expansion-browser-check.mjs
      - name: Frontline objective HUD, orders, medals, weapon motion and real Web Audio
        if: needs.scope.outputs.atv_only != 'true'
        run: node scripts/frontline-browser-check.mjs
      - name: Required names, visible rankings, field audio and match outcome screens
        if: needs.scope.outputs.atv_only != 'true'
        run: node scripts/match-polish-browser-check.mjs
      - name: Owner editor, transformations, Test walk, draft conflicts and publishing
        if: needs.scope.outputs.atv_only != 'true'
        run: EDITOR_CHECK_OUTPUT=test-results/expansion/map-editor node scripts/map-editor-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-browser-evidence
          path: test-results/expansion
          retention-days: 14
  performance:
    needs: scope
    if: needs.scope.outputs.atv_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bounded bot fairness scenarios
        run: BOT_VALIDATE=1 BOT_DUELS_ONLY=1 node scripts/bot-behavior-check.mjs
      - name: Compare warmed CPU work with the previous production release
        run: |
          git worktree add --detach ../expansion-baseline c2866b6edbaaae26c4aac6f0717960e2c5a2bf7e
          ln -s "$GITHUB_WORKSPACE/node_modules" ../expansion-baseline/node_modules
          PERFORMANCE_BASELINE=../expansion-baseline node scripts/expansion-performance-check.mjs
      - name: Two and three player snapshot CPU comparison
        run: |
          git worktree add --detach ../network-baseline d66f9f64017c3cbebbef980df575dcc96a4ff930
          ln -s "$GITHUB_WORKSPACE/node_modules" ../network-baseline/node_modules
          NETWORK_PERF_BASELINE=../network-baseline node scripts/field-stability-performance-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-performance-evidence
          path: |
            test-results/expansion/performance.json
            test-results/expansion/field-stability-performance.json
          retention-days: 14
  deploy:
    # Exact ATV presentation scope uses focused checks. Gameplay and dependency
    # changes retain all gates; commit titles cannot skip them.
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.scope.result == 'success' && needs.build.result == 'success' && needs.browser.result == 'success' &&
      (needs.performance.result == 'success' || (needs.scope.outputs.atv_only == 'true' && needs.performance.result == 'skipped'))
    needs: [scope, build, browser, performance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ravelfront-build
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-live:
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Matching website/relay build, private host/guest match and live lobby
        run: node scripts/release-live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-live-evidence
          path: test-results/release-live
          retention-days: 14
