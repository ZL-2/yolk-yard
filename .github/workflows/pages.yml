  build:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Frame pacing, scenery collision, supply canopies, vault gaps and all watchtower stairs
        if: needs.scope.outputs.field_control_update == 'true'
        run: node --test tests/field-control-161.test.js tests/nature-collision-161.test.js tests/supply-drops-161.test.js tests/watchtowers-161.test.js tests/building.test.js tests/building-overhaul.test.js tests/map-editor.test.js tests/vault-grappler.test.js tests/remote-input.test.js tests/snapshot-codec.test.js tests/mobility-storm.test.js tests/season-one.test.js tests/field-systems.test.js tests/field-detail.test.js tests/arms.test.js tests/streaming-performance.test.js tests/ramp-floor-clearance.test.js tests/royale-loot.test.js
      - name: Real public host recovery with the new world and protocol
        if: needs.scope.outputs.field_control_update == 'true'
        run: node scripts/public-host-network-check.mjs
      - name: Compare 48-operator CPU and actual scenery memory with Update 160
        if: needs.scope.outputs.field_control_update == 'true'
        run: |
          git worktree add --detach ../field-control-baseline 1504170dc6edb7e115bd8faeb35b13ce264dbaef
          ln -s "$GITHUB_WORKSPACE/node_modules" ../field-control-baseline/node_modules
          FIELD_CONTROL_BASELINE=../field-control-baseline node scripts/field-control-performance-check.mjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.field_control_update == 'true'
        with:
          name: field-control-performance-evidence
          path: |
            test-results/expansion/field-control/performance.json
            test-results/expansion/built-world/performance.json
          retention-days: 14
      - name: Built-world geometry, clearance, identities, social privacy and singleton joins
        if: needs.scope.outputs.built_world_update == 'true'
        run: node --test tests/architecture-assets.test.js tests/remaining-world-assets.test.js tests/built-world-gameplay.test.js tests/bot-roster.test.js tests/main-match-singleton.test.js tests/ramp-floor-clearance.test.js tests/spectator-status.test.js tests/public-host.test.js tests/private-social.test.js tests/social-persistence.test.js tests/environment-detail.test.js tests/environment-props.test.js tests/ravel-arenas.test.js tests/render-performance.test.js tests/streaming-performance.test.js tests/building.test.js tests/building-overhaul.test.js tests/perspective.test.js tests/comfort.test.js
      - name: Real public host recovery and checkpoint migration
        if: needs.scope.outputs.built_world_update == 'true'
        run: node scripts/public-host-network-check.mjs
      - name: Compare architecture construction and memory with Update 159
        if: needs.scope.outputs.built_world_update == 'true'
        run: |
          git worktree add --detach ../architecture-baseline fbff33c6bbae34ee2c66be1635386ddb9804bb8c
