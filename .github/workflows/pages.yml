        if: needs.scope.outputs.lobby_home_update == 'true'
        run: node --test --test-concurrency=2 tests/private-social.test.js tests/public-pools.test.js tests/career.test.js tests/leaderboards.test.js tests/compete.test.js tests/release-history.test.js
      - uses: actions/upload-artifact@v4
