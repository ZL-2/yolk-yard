      - name: All operators, weapons, items, gear, sockets, poses and shared surfaces
        if: needs.scope.outputs.models_only == 'true'
        run: node --test tests/field-detail.test.js tests/arms.test.js tests/weapon-presentation.test.js tests/hitbox.test.js tests/shop-overhaul.test.js
      - name: Crew update gameplay, referrals, social, physics and recovery
        if: needs.scope.outputs.crew_update == 'true'
        run: node --test --test-concurrency=2 tests/crew-update.test.js tests/chat.test.js tests/field-stability.test.js tests/weapon-balance.test.js tests/match-polish.test.js tests/game.test.js tests/field-polish.test.js tests/snapshot-codec.test.js tests/social-persistence.test.js tests/kestrel-presentation.test.js tests/private-social.test.js tests/royale-teammate-bots.test.js tests/season-one.test.js
      - name: Perspective, camera, combat, building, rig, controls and replication
        if: needs.scope.outputs.perspective_update == 'true'
        run: node --test tests/perspective.test.js tests/keybinds.test.js tests/comfort.test.js tests/building.test.js tests/building-overhaul.test.js tests/combat-overhaul.test.js tests/crew-update.test.js tests/hitbox.test.js tests/remote-input.test.js tests/field-detail.test.js
      - name: Referral wallet, URL attribution and third-person wall editing
        if: needs.scope.outputs.referral_edit_fix == 'true'
        run: node --test tests/referral-edit-fixes.test.js tests/perspective.test.js tests/building-overhaul.test.js tests/crew-update.test.js
      - name: Public singleton, six-player congestion, recovery, party admission and transport regressions
        if: needs.scope.outputs.public_match_fix == 'true'
        run: node --test --test-concurrency=2 tests/public-disconnect.test.js tests/public-pools.test.js tests/main-match-singleton.test.js tests/public-host.test.js tests/relay-compact.test.js tests/relay-queue.test.js tests/realtime-resume.test.js tests/recurring-royale.test.js tests/private-social.test.js tests/field-stability.test.js tests/snapshot-codec.test.js tests/relay-liveness.test.js tests/continuity.test.js tests/deployment.test.js
      - name: Public host handoff, frozen hosts, scoring and inventory recovery
        if: needs.scope.outputs.public_match_fix == 'true'
        run: node scripts/public-host-network-check.mjs
      - name: Operator motion, draw clocks, live counts, party presence and rig budgets
        if: needs.scope.outputs.operator_refresh == 'true'
        run: node --test --test-concurrency=2 tests/operator-refresh.test.js tests/lobby-motion.test.js tests/arms.test.js tests/equip.test.js tests/field-detail.test.js tests/hitbox.test.js tests/private-social.test.js tests/crew-update.test.js tests/public-pools.test.js tests/leaderboards.test.js tests/deployment.test.js
      - name: Mixamo anatomy, state coverage, clock independence, weapon grips and camera safety
