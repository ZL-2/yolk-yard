          visual={'src/atv-model.js','src/vehicle-view.js'}
          previous=set(subprocess.check_output(['git','diff','--name-only','HEAD^^','HEAD^'],text=True).splitlines())
          workflow_fix='.github/workflows/pages.yml' in files and files<={'.github/workflows/pages.yml','docs/UPDATE_152.md'} and previous<=allowed and bool(previous&visual)
          scoped=files<=allowed and (bool(files&visual) or workflow_fix)
          aircraft_allowed={'src/kestrel-model.js','src/royale-view.js','scripts/kestrel-visual-browser-check.mjs','tests/kestrel-presentation.test.js','package.json','package-lock.json','src/releases.js','docs/UPDATE_154.md','.github/workflows/pages.yml'}
          aircraft_visual={'src/kestrel-model.js','src/royale-view.js'}
          aircraft_fix='.github/workflows/pages.yml' in files and files<={'.github/workflows/pages.yml','docs/UPDATE_154.md'} and previous<=aircraft_allowed and bool(previous&aircraft_visual)
          aircraft=files<=aircraft_allowed and (bool(files&aircraft_visual) or aircraft_fix)
          if aircraft and 'src/royale-view.js' in files:
            def normalize(s):
              s=s.replace("import {createKestrel,animateKestrel} from './kestrel-model.js';\n",'')
              s=re.sub(r' createTransport\(\)\{.*?(?= createStorm\(\)\{)','',s,flags=re.S)
              s=s.replace('  this.createTransport();\n','').replace('this.rotors.forEach(m=>m.rotation.y+=dt*(r.practice?.15:18));','').replace('animateKestrel(this.transport,{parked:r.practice,time:t,elapsed:r.elapsed},dt);','')
              return s
            aircraft=normalize(subprocess.check_output(['git','show','HEAD^:src/royale-view.js'],text=True))==normalize(Path('src/royale-view.js').read_text())
          model_allowed={'src/model-surfaces.js','src/humanoid.js','src/operator-designs.js','src/weapons.js','src/arms.js','src/celebration-view.js','src/royale-art.js','src/shop-models.js','src/collection-gear.js','src/view.js','src/weapon-presentation.js','src/inventory-previews.js','scripts/generate-inventory-previews.mjs','scripts/field-detail-browser-check.mjs','tests/field-detail.test.js','tests/arms.test.js','tests/shop-overhaul.test.js','package.json','package-lock.json','src/releases.js','docs/UPDATE_155.md','.github/workflows/pages.yml'}
          model_visual={'src/model-surfaces.js','src/humanoid.js','src/operator-designs.js','src/weapons.js','src/royale-art.js','src/shop-models.js','src/collection-gear.js','src/arms.js','src/celebration-view.js'}
          def preview(p): return p.startswith('public/inventory-previews/') and (p.endswith('.svg') or p=='public/inventory-previews/manifest.json')
          def model_paths(fs): return all(p in model_allowed or preview(p) for p in fs)
          model_followup=model_paths(files) and not bool(files&model_visual) and model_paths(previous) and bool(previous&model_visual)
          models=model_paths(files) and (bool(files&model_visual) or model_followup)
