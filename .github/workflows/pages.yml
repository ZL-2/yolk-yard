name: Test and publish Ravelfront
on:
  push:
    branches: [main]
    paths-ignore: [public/room-test.html, public/room-test.js, public/server-check.html, public/server-check.js, .github/workflows/publish-room-test.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ravelfront-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      atv_only: ${{ steps.scope.outputs.atv_only }}
      kestrel_only: ${{ steps.scope.outputs.kestrel_only }}
      models_only: ${{ steps.scope.outputs.models_only }}
      field_control_update: ${{ steps.scope.outputs.field_control_update }}
      public_match_fix: ${{ steps.scope.outputs.public_match_fix }}
      operator_refresh: ${{ steps.scope.outputs.operator_refresh }}
      mixamo_update: ${{ steps.scope.outputs.mixamo_update }}
      built_world_update: ${{ steps.scope.outputs.built_world_update }}
      environment_only: ${{ steps.scope.outputs.environment_only }}
      visual_only: ${{ steps.scope.outputs.visual_only }}
      crew_update: ${{ steps.scope.outputs.crew_update }}
      perspective_update: ${{ steps.scope.outputs.perspective_update }}
      referral_edit_fix: ${{ steps.scope.outputs.referral_edit_fix }}
      focused: ${{ steps.scope.outputs.focused }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - id: scope
        name: Select checks from the actual changed files
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
