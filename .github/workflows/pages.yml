      - name: Compare scenery construction and memory with Update 158
        if: needs.scope.outputs.environment_only == 'true'
        run: |
          git worktree add --detach ../environment-baseline a35d1dd88c618d7865356bd79ef71234c4afa22d
          ln -s "$GITHUB_WORKSPACE/node_modules" ../environment-baseline/node_modules
          ENVIRONMENT_BASELINE=../environment-baseline node scripts/environment-performance-check.mjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.environment_only == 'true'
