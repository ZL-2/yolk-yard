name: Test and publish Ravelfront
on:
  push:
    branches: [main]
    paths-ignore: [public/room-test.html, public/room-test.js, public/server-check.html, public/server-check.js, .github/workflows/publish-room-test.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ravelfront-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: All unit and real socket regression tests
        run: node --test --test-concurrency=2 tests/*.test.js
      - name: Public host election, reconnection, migration, scoring and inventory
        run: node scripts/public-host-network-check.mjs
      - name: Map publishing and pinned multiplayer layouts
        run: node scripts/map-editor-network-check.mjs
      - name: Frontline captures, rewards and interrupted recovery across real sockets
        run: node scripts/frontline-network-check.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ravelfront-build
          path: dist
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Shop collections, boss models, styles, bundles, purchases and update art
        run: node scripts/shop-overhaul-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-browser-evidence
          path: test-results/expansion/shop
          retention-days: 14
      - name: Desktop/mobile controls, inventory, combat HUD and camera
        run: node scripts/expansion-browser-check.mjs
      - name: Frontline objective HUD, orders, medals, weapon motion and real Web Audio
        run: node scripts/frontline-browser-check.mjs
      - name: Required names, visible rankings, field audio and match outcome screens
        run: node scripts/match-polish-browser-check.mjs
      - name: Owner editor, transformations, Test walk, draft conflicts and publishing
        run: EDITOR_CHECK_OUTPUT=test-results/expansion/map-editor node scripts/map-editor-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-browser-evidence
          path: test-results/expansion
          retention-days: 14
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bounded bot fairness scenarios
        run: BOT_VALIDATE=1 BOT_DUELS_ONLY=1 node scripts/bot-behavior-check.mjs
      - name: Compare warmed CPU work with the previous production release
        run: |
          git worktree add --detach ../expansion-baseline c2866b6edbaaae26c4aac6f0717960e2c5a2bf7e
          ln -s "$GITHUB_WORKSPACE/node_modules" ../expansion-baseline/node_modules
          PERFORMANCE_BASELINE=../expansion-baseline node scripts/expansion-performance-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-performance-evidence
          path: test-results/expansion/performance.json
          retention-days: 14
  deploy:
    # Every release uses the same gates. Commit titles cannot skip tests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, browser, performance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ravelfront-build
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Matching website/relay build, private host/guest match and live lobby
        run: node scripts/release-live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-live-evidence
          path: test-results/release-live
          retention-days: 14
