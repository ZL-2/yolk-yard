            def model_view(s):
              s=s.replace("import {modelMaterial,MODEL_ART_REVISION} from './model-surfaces.js';\n",'')
              s=re.sub(r'  rocketModel\(\)\{.*?(?=  itemPreview\()','',s,flags=re.S)
              return s.replace('          !o.material.map.userData.shared &&\n','')
            models=model_view(subprocess.check_output(['git','show','HEAD^:src/view.js'],text=True))==model_view(Path('src/view.js').read_text())
