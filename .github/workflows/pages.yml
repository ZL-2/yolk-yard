          def crew_paths(fs,base):
            for path in fs:
              if path in crew_allowed: continue
              if not path.startswith('scripts/') or not path.endswith('.mjs'): return False
              if subprocess.run(['git','cat-file','-e',base+':'+path],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode: return False
