      field_control_update: ${{ steps.scope.outputs.field_control_update }}
      public_match_fix: ${{ steps.scope.outputs.public_match_fix }}
      operator_refresh: ${{ steps.scope.outputs.operator_refresh }}
      mixamo_update: ${{ steps.scope.outputs.mixamo_update }}
      field_repair_update: ${{ steps.scope.outputs.field_repair_update }}
      zombies_update: ${{ steps.scope.outputs.zombies_update }}
      box_fights_update: ${{ steps.scope.outputs.box_fights_update }}
      zone_wars_update: ${{ steps.scope.outputs.zone_wars_update }}
