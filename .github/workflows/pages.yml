  build:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tournament lifecycle, spectators, rewards, camera and transport regressions
        if: needs.scope.outputs.tournament_update == 'true'
        run: |
          node --test --test-concurrency=2 tests/tournament.test.js tests/compete.test.js tests/snapshot-codec.test.js tests/perspective.test.js tests/character-motion.test.js tests/built-world-gameplay.test.js tests/royale-prestige.test.js tests/egg-shop.test.js tests/server-authority.test.js tests/owner.test.js tests/relay-compact.test.js tests/relay-queue.test.js tests/public-host.test.js tests/release-history.test.js
          node --test tests/tournament-owner.test.js tests/owner-network.test.js tests/owner-request.test.js
          node --expose-gc scripts/tournament-performance.mjs
      - name: Tactical map, competitive career, awards and combat HUD regressions
        if: needs.scope.outputs.field214_update == 'true'
        run: |
          node --test --test-concurrency=2 tests/field214.test.js tests/royale-prestige.test.js tests/leaderboards.test.js tests/owner.test.js tests/owner-network.test.js tests/owner-request.test.js tests/compete.test.js tests/career.test.js tests/perspective.test.js tests/tournament.test.js tests/tournament-owner.test.js tests/egg-shop.test.js tests/release-history.test.js
