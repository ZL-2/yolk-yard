name: Test and publish Ravelfront
on:
  push:
    branches: [main]
    paths-ignore: [public/room-test.html, public/room-test.js, public/server-check.html, public/server-check.js, .github/workflows/publish-room-test.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ravelfront-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      field214_update: ${{ steps.scope.outputs.field214_update }}
      lobby_home_update: ${{ steps.scope.outputs.lobby_home_update }}
