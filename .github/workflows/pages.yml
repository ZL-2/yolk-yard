              return re.sub(r'// Item surfaces deliberately.*?(?=export const DISTRICT_STYLES)','',s,flags=re.S)
            models=world_art(subprocess.check_output(['git','show','HEAD^:src/royale-art.js'],text=True))==world_art(Path('src/royale-art.js').read_text())
          if models and 'src/humanoid.js' in files:
