        if: needs.scope.outputs.perspective_update == 'true'
        run: node scripts/perspective-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.perspective_update == 'true'
        with:
          name: perspective-evidence
          path: test-results/perspective
          retention-days: 14
      - name: Crew referral, host and guest, smoke, chat, HUD and victory acceptance
        if: needs.scope.outputs.crew_update == 'true'
        run: node scripts/crew-update-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.crew_update == 'true'
        with:
          name: crew-update-evidence
          path: test-results/crew-update
          retention-days: 14
      - name: Actual ATV appearance, desktop and mobile, driving and two riders
        if: needs.scope.outputs.atv_only == 'true'
        run: node scripts/atv-browser-check.mjs
      - name: Actual Kestrel airfield, cockpit, cargo, flight, host and guest deployment
        if: needs.scope.outputs.kestrel_only == 'true'
        run: node scripts/kestrel-visual-browser-check.mjs
      - name: Render all inventory thumbnails from the actual upgraded PBR models
        if: needs.scope.outputs.models_only == 'true'
        run: node scripts/generate-inventory-previews.mjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.models_only == 'true'
        with:
          name: field-detail-preview-assets
          path: public/inventory-previews
          retention-days: 14
      - name: Actual lobby, boss shop portrait, first-person weapons and complete asset catalogs
        if: needs.scope.outputs.models_only == 'true'
        run: node scripts/field-detail-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.models_only == 'true'
        with:
          name: field-detail-browser-evidence
          path: test-results/expansion/field-detail
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.kestrel_only == 'true'
        with:
          name: kestrel-browser-evidence
          path: test-results/expansion/kestrel
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.atv_only == 'true'
        with:
          name: atv-browser-evidence
          path: test-results/expansion/atv
          retention-days: 14
      - name: Sentinels, capture HUD, live roster, presence, reconnection and inbox
        if: needs.scope.outputs.focused != 'true'
        run: node scripts/field-stability-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.focused != 'true'
        with:
          name: field-stability-browser-evidence
          path: test-results/expansion/stability
          retention-days: 14
      - name: Shop collections, boss models, styles, bundles, purchases and update art
        if: needs.scope.outputs.focused != 'true'
        run: node scripts/shop-overhaul-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.focused != 'true'
        with:
          name: shop-browser-evidence
          path: test-results/expansion/shop
          retention-days: 14
      - name: Desktop/mobile controls, inventory, combat HUD and camera
        if: needs.scope.outputs.focused != 'true'
        run: node scripts/expansion-browser-check.mjs
      - name: Frontline objective HUD, orders, medals, weapon motion and real Web Audio
        if: needs.scope.outputs.focused != 'true'
        run: node scripts/frontline-browser-check.mjs
      - name: Required names, visible rankings, field audio and match outcome screens
        if: needs.scope.outputs.focused != 'true'
        run: node scripts/match-polish-browser-check.mjs
      - name: Owner editor, transformations, Test walk, draft conflicts and publishing
        if: needs.scope.outputs.focused != 'true'
        run: EDITOR_CHECK_OUTPUT=test-results/expansion/map-editor node scripts/map-editor-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-browser-evidence
          path: test-results/expansion
          retention-days: 14
  performance:
    needs: scope
    if: needs.scope.outputs.focused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bounded bot fairness scenarios
        run: BOT_VALIDATE=1 BOT_DUELS_ONLY=1 node scripts/bot-behavior-check.mjs
      - name: Compare warmed CPU work with the previous production release
        run: |
          git worktree add --detach ../expansion-baseline c2866b6edbaaae26c4aac6f0717960e2c5a2bf7e
          ln -s "$GITHUB_WORKSPACE/node_modules" ../expansion-baseline/node_modules
          PERFORMANCE_BASELINE=../expansion-baseline node scripts/expansion-performance-check.mjs
      - name: Two and three player snapshot CPU comparison
        run: |
          git worktree add --detach ../network-baseline d66f9f64017c3cbebbef980df575dcc96a4ff930
          ln -s "$GITHUB_WORKSPACE/node_modules" ../network-baseline/node_modules
          NETWORK_PERF_BASELINE=../network-baseline node scripts/field-stability-performance-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-performance-evidence
          path: |
            test-results/expansion/performance.json
            test-results/expansion/field-stability-performance.json
          retention-days: 14
  deploy:
    # File-scoped releases run their matching gameplay/presentation acceptance.
    # Other changes retain all gates; commit titles cannot skip them.
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.scope.result == 'success' && needs.build.result == 'success' && needs.browser.result == 'success' &&
      (needs.performance.result == 'success' || (needs.scope.outputs.focused == 'true' && needs.performance.result == 'skipped'))
    needs: [scope, build, browser, performance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ravelfront-build
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.models_only == 'true'
        with:
          name: field-detail-preview-assets
          path: dist/inventory-previews
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-live:
    needs: [scope, deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: needs.scope.outputs.owner_suite_update != 'true' && needs.scope.outputs.visit_update != 'true' && needs.scope.outputs.history_only != 'true' && needs.scope.outputs.flight_combat_fix != 'true' && needs.scope.outputs.vehicle_field_fix != 'true' && needs.scope.outputs.water_lean_update != 'true' && needs.scope.outputs.combat_performance_update != 'true' && needs.scope.outputs.royale_prestige_update != 'true' && needs.scope.outputs.rank_match_fix != 'true' && needs.scope.outputs.prestige_sets_update != 'true' && needs.scope.outputs.wren_study_update != 'true' && needs.scope.outputs.tournament_update != 'true' && needs.scope.outputs.lobby_home_update != 'true' && needs.scope.outputs.field214_update != 'true'
      - name: Install the focused headless desktop runtime
        if: needs.scope.outputs.flight_combat_fix == 'true' || needs.scope.outputs.vehicle_field_fix == 'true' || needs.scope.outputs.water_lean_update == 'true' || needs.scope.outputs.combat_performance_update == 'true' || needs.scope.outputs.royale_prestige_update == 'true' || needs.scope.outputs.rank_match_fix == 'true' || needs.scope.outputs.prestige_sets_update == 'true' || needs.scope.outputs.wren_study_update == 'true' || needs.scope.outputs.tournament_update == 'true' || needs.scope.outputs.lobby_home_update == 'true' || needs.scope.outputs.field214_update == 'true'
        run: |
          npx playwright install chromium --only-shell
          node --input-type=module -e "import {chromium} from 'playwright'; const browser=await chromium.launch({args:['--no-sandbox']}); await browser.close();" || npx playwright install-deps chromium
      - name: Published history redaction
        if: needs.scope.outputs.history_only == 'true'
        run: node scripts/history-live-check.mjs
      - name: Published owner suite, persistent disk, private endpoints, and matching builds
        if: needs.scope.outputs.owner_suite_update == 'true' || needs.scope.outputs.visit_update == 'true'
        run: node scripts/owner-live-check.mjs
      - name: Matching website/relay build, private PvP, paused Zombies and live lobby
        if: needs.scope.outputs.owner_suite_update != 'true' && needs.scope.outputs.visit_update != 'true' && needs.scope.outputs.history_only != 'true'
        run: node scripts/release-live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-live-evidence
          path: test-results/release-live
          retention-days: 14
