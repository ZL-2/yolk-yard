name: Verify published Yolk Yard
on:
  push:
    branches: ['verify-live/**']
  workflow_dispatch:
    inputs:
      build:
        description: Published game commit to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify served build and two-player live party flow
        env:
          YOLK_EXPECTED_BUILD: ${{ inputs.build || github.ref_name }}
        run: node scripts/lobby-live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-lobby
          path: test-results/live-lobby
