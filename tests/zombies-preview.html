<!doctype html><html lang="en"><meta charset="utf-8"><title>Blacktide Relay rendering review</title><style>body{margin:24px;background:#10212a;color:#efe1c4;font:14px system-ui}h1{letter-spacing:4px}main{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}article{background:#263e49;border:1px solid #77928d;border-radius:6px;overflow:hidden}img{width:100%;display:block}strong{display:block;padding:12px}.map{grid-column:span 2}</style><h1>RAVELFRONT / BLACKTIDE RELAY</h1><p>Actual game models, authored facility and original special weapons.</p><main></main><script type="module">
import * as T from 'three';import {ZombiesView,buildBlacktide} from '/src/zombies-view.js';import {Z_TYPES} from '/src/zombies-config.js';import {makeBlaster} from '/src/zombies-weapons.js';import {makeExpeditionVehicle} from '/src/zombies-actors.js';
const base=document.createElement('base');base.href='/';document.head.append(base);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(420,360);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.background=new T.Color('#1c333d');scene.add(new T.HemisphereLight(0xd7eff5,0x3a514f,2.2));const sun=new T.DirectionalLight(0xffdca9,2.8);sun.position.set(-6,12,8);scene.add(sun);const world=new T.Group();scene.add(world);const view=new ZombiesView(scene,world),camera=new T.PerspectiveCamera(42,420/360,.05,300);window.checks=[];await view.actors.load();
function shot(name,wide=false){renderer.render(scene,camera);const tile=document.createElement('article');if(wide)tile.className='map';const image=new Image(),title=document.createElement('strong');image.src=renderer.domElement.toDataURL();title.textContent=name;tile.append(image,title);document.querySelector('main').append(tile);window.checks.push({name,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles});}
for(const [i,[type,stats]]of Object.entries(Z_TYPES).entries()){const e={id:i+1,type,x:0,y:0,z:0,yaw:0,health:100,maxHealth:100,state:'walk',born:0,emergeUntil:0,attackAt:3.8,attackEnd:4.2,phase:i,vx:i%2?0:1.7,vz:0};camera.position.set(-2.3*stats.scale,1.65*stats.scale,-3.4*stats.scale);camera.lookAt(0,.95*stats.scale,0);for(let frame=0;frame<36;frame++)view.update({time:4+frame/60,zombies:{enemies:[e],effects:[],drops:[],grenades:[],traps:{}}},1/60,camera,true);shot(stats.name);}
view.group.visible=false;for(const id of ['arcLoom','riftDriver','cinderLance']){const gun=makeBlaster(id);scene.add(gun);camera.position.set(-2,.7,1.6);camera.lookAt(0,0,-.05);shot(gun.name);scene.remove(gun);}
const rover=makeExpeditionVehicle();scene.add(rover);camera.position.set(-3,2.8,-4);camera.lookAt(0,1,0);shot('Four-seat field rover');scene.remove(rover);
buildBlacktide(world);renderer.setSize(840,480);camera.aspect=840/480;camera.updateProjectionMatrix();scene.fog=new T.Fog(0xa5b5b6,65,245);for(const [name,pos,look]of [['Harbor Approach',[-145,8,142],[-112,2,100]],['Old Town',[-40,8,145],[10,2,100]],['Reactor Works',[35,15,-65],[0,8,-120]],['Signal Observatory',[145,12,-70],[105,7,-110]],['Harbor interior',[-120,1.7,112],[-126,1.5,101]],['Coastal ridge',[-153,5,-65],[-142,4,-77]]]){camera.position.set(...pos);camera.lookAt(...look);shot(name,true);}window.ready=true;
</script></html>
