<!doctype html><html><head><meta charset="UTF-8"><title>Camera alignment review</title><style>body{margin:0;background:#182638;color:#fff;font:14px system-ui}canvas{display:block}#reticle{position:fixed;left:50%;top:50%;width:18px;height:18px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}#reticle:after{content:'';position:absolute;inset:7px;background:#fff}aside{position:fixed;top:25px;left:30px;line-height:1.8;background:#102638df;padding:18px}strong{font-size:21px}</style></head><body><aside><strong>RAVEL FRONT · CAMERA REVIEW</strong><div id="label"></div></aside><div id="reticle"></div><script type="module">
import * as T from 'three';import {makeEgg} from '../src/view.js';import {animateHumanoid} from '../src/humanoid.js';import {cameraPose,reticleTarget,weaponAimAt} from '../src/perspective.js';import {perspectiveFov} from '../src/settings.js';import {direction,VIEWMODEL} from '../src/physics.js';import {eyeHeight} from '../src/stance.js';import {updateArms} from '../src/arms.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#91a8b4');scene.add(new T.HemisphereLight(0xffffff,0x53636b,2));const sun=new T.DirectionalLight(0xffefdc,2.8);sun.position.set(-5,8,3);scene.add(sun);scene.add(new T.GridHelper(60,60,0x41616e,0x708d98));
const model=makeEgg({weapon:'sprinter',outfit:'outfit-wren'});scene.add(model);const camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,.05,300);
const target=new T.Mesh(new T.SphereGeometry(.12,12,12),new T.MeshBasicMaterial({color:0xe85b43}));scene.add(target);
window.cameraReview=mode=>{const p={x:0,y:0,z:0,yaw:0,pitch:mode==='down'?-.6:mode==='up'?.5:0,health:100,grounded:true,weapon:'sprinter',perspective:'third',aim:mode==='aim',viewBlend:mode==='aim'?1:0,viewBoom:1,crouching:mode==='crouch'},pose=cameraPose(null,p),{point}=reticleTarget(null,p,20),held=model.userData.held;camera.position.copy(pose.origin);camera.rotation.set(p.pitch,p.yaw,0,'YXZ');camera.fov=perspectiveFov({thirdPersonFov:80},true,camera.aspect);if(p.aim)camera.fov=2*Math.atan(Math.tan(camera.fov*Math.PI/360)/1.18)*180/Math.PI;camera.updateProjectionMatrix();
held.position.set(VIEWMODEL.x,eyeHeight(p)+VIEWMODEL.y,VIEWMODEL.z);const aim=weaponAimAt(p,point,held.position);held.rotation.set(aim.pitch,aim.yaw,0,'YXZ');updateArms(model.userData.arms,-1,model.userData.blaster);for(let i=0;i<120;i++)animateHumanoid(model,p,1/60,i/60);model.updateMatrixWorld(true);target.position.copy(point);renderer.render(scene,camera);
const muzzle=model.userData.blaster.userData.muzzle.getWorldPosition(new T.Vector3()),dir=direction(aim.yaw,aim.pitch),delta=new T.Vector3(point.x,point.y,point.z).sub(muzzle).normalize(),error=delta.distanceTo(new T.Vector3(dir.x,dir.y,dir.z));document.querySelector('#label').textContent=mode+' · horizontal FOV 80° · camera height '+pose.origin.y.toFixed(2)+'m';renderer.render(scene,camera);return {error};};window.cameraReview('hip');window.reviewReady=true;
</script></body></html>
