<!doctype html><html><head><meta charset="utf-8"><title>Ravelfront visual verification</title><style>body{margin:20px;background:#172f3a;color:#e5eeed;font:14px Arial}h1{letter-spacing:.1em}main{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{background:#29444f;border:1px solid #5b797f;border-radius:5px}.tile img{width:100%;display:block}.tile strong{display:block;padding:8px}</style></head><body><h1>RAVELFRONT / OPERATORS & HANDLING</h1><main id="gallery"></main><script type="module">
import * as T from 'three';import {makeEgg} from '../src/view.js';import {animateHumanoid,humanoidDiagnostics} from '../src/humanoid.js';import {SHOP_ITEMS} from '../src/shop-catalog.js';import {updateArms,throwArms} from '../src/arms.js';import {makeShopGlider} from '../src/shop-models.js';import {ROYALE_GUN_IDS} from '../src/royale-data.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(360,430);renderer.outputColorSpace=T.SRGBColorSpace;
const shots=[];for(const item of SHOP_ITEMS.filter(i=>i.slot==='outfit'&&!i.id.endsWith('-alt')))shots.push({name:item.name,profile:{...item.profile,outfit:item.id,weapon:'sprinter'},pose:{}});
for(const id of ROYALE_GUN_IDS)for(const reload of [-1,.45])shots.push({name:id+' / '+(reload<0?'grip':'reload'),profile:{outfit:'outfit-garden',weapon:id},pose:{reload}});
for(const [name,pose]of Object.entries({walk:{vz:-3},strafe:{vx:4},run:{vz:-7},sprint:{vz:-7.4,sprinting:true},jump:{grounded:false,vy:5},fall:{grounded:false,vy:-5},glide:{grounded:false,flight:'glide'},dive:{grounded:false,flight:'dive'},build:{building:true},use:{use:{id:'mini'}},eliminated:{health:0},throw:{throw:.32}}))shots.push({name,profile:{outfit:'outfit-frost',weapon:'sprinter'},pose});
window.checks=[];
for(const shot of shots){const scene=new T.Scene();scene.background=new T.Color('#aebdc0');scene.add(new T.HemisphereLight(0xffffff,0x536c78,2.1));const light=new T.DirectionalLight(0xffecd6,2.6);light.position.set(-3,5,-4);scene.add(light);const model=makeEgg(shot.profile,-1,!shot.pose.flight&&!shot.pose.building&&!shot.pose.use&&shot.pose.health!==0);scene.add(model);if(shot.pose.flight==='glide')scene.add(makeShopGlider('glider-cloud'));if(shot.pose.flight==='dive')model.rotation.x=.78;const p={health:100,grounded:true,yaw:0,...shot.pose};if(model.userData.arms){updateArms(model.userData.arms,shot.pose.reload??-1,model.userData.blaster);if(shot.pose.throw)throwArms(model.userData.arms,shot.pose.throw);}
for(let i=0;i<55;i++)animateHumanoid(model,p,1/60,i/60);const camera=new T.PerspectiveCamera(32,360/430,.01,30);camera.position.set(-2.2,1.65,-3.6);camera.lookAt(0,.95,-.1);renderer.render(scene,camera);const tile=document.createElement('article');tile.className='tile';const img=new Image();img.src=renderer.domElement.toDataURL();tile.append(img);const title=document.createElement('strong');title.textContent=shot.name;tile.append(title);document.querySelector('#gallery').append(tile);window.checks.push(humanoidDiagnostics(model));}
window.ready=true;
</script></body></html>
