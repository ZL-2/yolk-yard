<!doctype html><html lang="en"><meta charset="utf-8"><title>Field Repair rendering review</title><link rel="stylesheet" href="/loading.css"><style>body{margin:20px;background:#102332;color:#edf4f5;font:14px system-ui}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}article{background:#214354;border:1px solid #628a9b;border-radius:7px;overflow:hidden}img{width:100%;display:block}strong{display:block;padding:10px}#loading-screen{display:none}</style><h1>RAVELFRONT / FIELD REPAIR</h1><main></main><script type="module">
import * as T from 'three';import {makeBlaster} from '/src/weapons.js';import {makeArms,updateArms} from '/src/arms.js';import {buildDetailedTerrain,createDetailedOcean,terrainDetailDiagnostics} from '/src/terrain-detail.js';import {getMap} from '/src/maps.js';import {groundAt} from '/src/terrain.js';import {makeATV} from '/src/atv-model.js';import {vehicleSupportHeight} from '/src/vehicles.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(340,260);renderer.outputColorSpace=T.SRGBColorSpace;const scene=new T.Scene();scene.background=new T.Color('#657b88');scene.add(new T.HemisphereLight(0xffffff,0x324553,2.8));const light=new T.DirectionalLight(0xffe8cd,3);light.position.set(-3,5,-4);scene.add(light);const camera=new T.PerspectiveCamera(42,340/260,.03,1500);window.checks=[];
function shot(title){renderer.render(scene,camera);const tile=document.createElement('article'),img=new Image(),label=document.createElement('strong');img.src=renderer.domElement.toDataURL();label.textContent=title;tile.append(img,label);document.querySelector('main').append(tile);}
for(const [id,label]of [['sprinter','Rifle magazine'],['pip','Pistol magazine'],['duet','Bullpup magazine'],['anchor','Heavy magazine'],['needle','Bolt rifle'],['scatter','Break action'],['doubleyolk','Tube fed'],['thumper','Rocket']]){const model=makeBlaster(id),arms=makeArms(id);model.add(arms);scene.add(model);updateArms(arms,id==='scatter'?.34:.6,model,0,1,null,true);camera.position.set(-1.55,.6,1.55);camera.lookAt(0,-.18,-.22);shot(label);window.checks.push({id,meshes:renderer.info.render.calls,finite:model.children.every(x=>x.position.toArray().every(Number.isFinite))});scene.remove(model);}
const map=getMap('sunnybreak'),world=new T.Group();world.add(createDetailedOcean(map));for(const _ of buildDetailedTerrain(world,map)){}scene.add(world);for(const [x,z,label]of [[-61,8,'Road junction'],[-119,-118,'Farm approach'],[83,-135,'Elevated terrain']]){const y=groundAt(map,x,z);camera.position.set(x+12,y+18,z+14);camera.lookAt(x,y,z);await renderer.compileAsync(scene,camera);shot(label);}window.checks.push(terrainDetailDiagnostics(world));
const atv=makeATV(),v={x:88,z:45,y:groundAt(map,88,45),yaw:.6,pitch:.2,roll:-.12};v.y=vehicleSupportHeight(map,v);atv.position.set(v.x,v.y,v.z);atv.rotation.set(v.pitch,v.yaw,v.roll,'YXZ');scene.add(atv);camera.position.set(v.x+3,v.y+2.2,v.z+4);camera.lookAt(v.x,v.y+.8,v.z);shot('ATV terrain contact');
for(const [file,label]of [['season-one-172','Season One'],['harbor-172','Breakwater Harbor'],['recon-172','Coastal Recon']]){const tile=document.createElement('article'),img=new Image(),title=document.createElement('strong');img.src='/loading/'+file+'.webp';title.textContent=label;await img.decode();tile.append(img,title);document.querySelector('main').append(tile);}window.ready=true;
</script></html>
